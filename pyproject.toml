[project]
name = "ocrnhat"
version = "0.1.0"
description = "OCR PDF/ảnh chỉ lấy tiếng Nhật (NDLOCR-Lite, chạy offline)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest"]
# dò chữ nghi ngờ (--suspect), thử nghiệm; không đóng gói vào exe
suspect = ["torch", "transformers", "fugashi", "unidic-lite"]
# engine Chandra (tùy chọn, cần GPU NVIDIA); trọng số theo OpenRAIL-M, xem NOTICE.md; không đóng gói vào exe
chandra = ["chandra-ocr[hf]==0.2.0"]

[project.scripts]
ocrnhat = "ocrnhat.cli:main"
ocrnhat-pdf = "ocrnhat.pdf_extract:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrnhat = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
