[project]
name = "ocrnhat"
version = "0.1.0"
description = "OCR PDF/ảnh chỉ lấy tiếng Nhật (RapidOCR, chạy offline)"
requires-python = ">=3.10"
dependencies = ["rapidocr>=3.0", "onnxruntime", "pypdfium2", "opencv-python-headless", "numpy", "Pillow"]
[project.scripts]
ocrnhat = "ocrnhat.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
