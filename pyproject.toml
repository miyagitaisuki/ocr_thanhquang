[project]
name = "ocrnhat"
version = "0.1.0"
description = "OCR PDF/ảnh chỉ lấy tiếng Nhật (NDLOCR-Lite, chạy offline)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest"]
# giao diện chính (run_gui.py, đóng gói vào exe); PySide6 theo LGPL-3.0
qt = ["PySide6-Essentials>=6.7"]
# dò chữ nghi ngờ (--suspect), thử nghiệm; không đóng gói vào exe
suspect = ["torch", "transformers", "fugashi", "unidic-lite"]

[project.scripts]
ocrnhat = "ocrnhat.cli:main"
ocrnhat-pdf = "ocrnhat.pdf_extract:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrnhat = ["fonts/*", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
