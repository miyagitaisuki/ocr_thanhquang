name: Build Windows exe (GPU NVIDIA)
# Bản riêng cho máy có card NVIDIA: dùng onnxruntime-gpu (CUDA). Bản CPU vẫn ở build-exe.yml.
# Người dùng cần driver NVIDIA. Torch CUDA và Chandra KHÔNG đóng vào exe: app tải gói GPU khi người dùng bấm nút.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tải NDLOCR-Lite (commit đã ghim)
        run: python scripts/fetch_ndlocr.py
      - name: Cài thư viện
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
          pip install -e .
      - name: "Thay onnxruntime CPU bằng onnxruntime-gpu (làm sau cùng vì pip install -e . kéo lại bản CPU)"
        run: |
          pip uninstall -y onnxruntime
          pip install onnxruntime-gpu
      - name: Kiểm tra onnxruntime có CUDA
        run: |
          python -c "import onnxruntime as o; p=o.get_available_providers(); print(p); assert 'CUDAExecutionProvider' in p"
      - name: Smoke test (OCR ảnh mẫu, dựng docx)
        run: python scripts/smoke_test.py
      - name: Build exe (giao diện GPU)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name OCR-Nhat-GPU
          --paths src --paths vendor/ndlocr-lite/src
          --add-data "vendor/ndlocr-lite/src/model;ndlocr_src/model"
          --add-data "vendor/ndlocr-lite/src/config;ndlocr_src/config"
          --add-data "src/ocrnhat/fonts;ocrnhat/fonts"
          --collect-all onnxruntime --collect-all docx --collect-all tkinterdnd2
          --collect-all pip
          run_gui.py
      - name: Build exe (dòng lệnh GPU)
        run: >
          pyinstaller --noconfirm --onedir --console --name ocrnhat-cli-gpu
          --paths src --paths vendor/ndlocr-lite/src
          --add-data "vendor/ndlocr-lite/src/model;ndlocr_src/model"
          --add-data "vendor/ndlocr-lite/src/config;ndlocr_src/config"
          --add-data "src/ocrnhat/fonts;ocrnhat/fonts"
          --collect-all onnxruntime --collect-all docx --collect-all tkinterdnd2
          --collect-all pip
          run_gui.py
      - name: Kiểm tra pip đóng gói sẵn (người dùng bấm "Cài tăng tốc GPU")
        shell: pwsh
        run: ./dist/ocrnhat-cli-gpu/ocrnhat-cli-gpu.exe --check-gpu-pack
      - name: "Kiểm tra exe GPU (runner không có GPU: phải lùi về CPU và vẫn OCR đúng)"
        shell: pwsh
        run: |
          ./dist/ocrnhat-cli-gpu/ocrnhat-cli-gpu.exe smoke.png -o exe_out --device auto
          $docx = Get-ChildItem exe_out -Filter *.docx | Select-Object -First 1
          if (-not $docx) { throw "exe GPU không tạo ra docx" }
          $txt = Get-ChildItem exe_out -Filter *.txt | Select-Object -First 1
          $t = Get-Content $txt.FullName -Encoding UTF8 -Raw
          Write-Host $t
          if ($t -notmatch "日本語") { throw "exe GPU không OCR được" }
      # không nén zip: bản GPU vài GB, upload-artifact tự nén; trọng số Chandra KHÔNG đóng vào (người dùng tải lần đầu)
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Nhat-GPU-windows
          path: |
            dist/OCR-Nhat-GPU
            dist/ocrnhat-cli-gpu
