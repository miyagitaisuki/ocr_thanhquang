name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
          pip install -e .
      - name: Smoke test (tải model, OCR ảnh mẫu)
        run: python scripts/smoke_test.py
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onedir --windowed --name OCR-Nhat
          --collect-all rapidocr --collect-all onnxruntime
          --paths src run_gui.py
      - name: Build exe (console, để chạy dòng lệnh)
        run: >
          pyinstaller --noconfirm --onedir --console --name ocrnhat-cli
          --collect-all rapidocr --collect-all onnxruntime
          --paths src run_gui.py
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OCR-Nhat/* -DestinationPath OCR-Nhat-windows.zip
          Compress-Archive -Path dist/ocrnhat-cli/* -DestinationPath ocrnhat-cli-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Nhat-windows
          path: "*.zip"
