name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tải NDLOCR-Lite (commit đã ghim)
        run: python scripts/fetch_ndlocr.py
      - name: Cài thư viện
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
          pip install -e .
      - name: Smoke test (OCR ảnh mẫu, dựng docx)
        run: python scripts/smoke_test.py
      - name: Build exe (giao diện)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name OCR-Nhat
          --paths src --paths vendor/ndlocr-lite/src
          --add-data "vendor/ndlocr-lite/src/model;ndlocr_src/model"
          --add-data "vendor/ndlocr-lite/src/config;ndlocr_src/config"
          --collect-all onnxruntime --collect-all docx
          run_gui.py
      - name: Build exe (dòng lệnh)
        run: >
          pyinstaller --noconfirm --onedir --console --name ocrnhat-cli
          --paths src --paths vendor/ndlocr-lite/src
          --add-data "vendor/ndlocr-lite/src/model;ndlocr_src/model"
          --add-data "vendor/ndlocr-lite/src/config;ndlocr_src/config"
          --collect-all onnxruntime --collect-all docx
          run_gui.py
      - name: Kiểm tra chính file exe (OCR ảnh mẫu ra docx)
        shell: pwsh
        run: |
          ./dist/ocrnhat-cli/ocrnhat-cli.exe smoke.png -o exe_out
          if (-not (Test-Path exe_out/smoke.docx)) { throw "exe không tạo ra docx" }
          $t = Get-Content exe_out/smoke.txt -Encoding UTF8 -Raw
          Write-Host $t
          if ($t -notmatch "日本語") { throw "exe không OCR được" }
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OCR-Nhat/* -DestinationPath OCR-Nhat-windows.zip
          Compress-Archive -Path dist/ocrnhat-cli/* -DestinationPath ocrnhat-cli-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Nhat-windows
          path: "*.zip"
